<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful and simple To-Do application to manage your tasks efficiently">
    <title>✨ To-Do App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --shadow-soft: 0 8px 32px rgba(102, 126, 234, 0.2);
            --shadow-hover: 0 12px 40px rgba(102, 126, 234, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: var(--primary-gradient);
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: var(--secondary-gradient);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 520px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .app-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            margin-bottom: 8px;
        }

        .app-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            font-weight: 300;
        }

        .todo-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            padding: 30px;
            box-shadow: var(--shadow-soft);
        }

        .input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .todo-input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
        }

        .todo-input::placeholder {
            color: var(--text-secondary);
        }

        .todo-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .add-btn {
            padding: 16px 24px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
        }

        .add-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .add-btn:active {
            transform: scale(0.98);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .stat-number {
            font-weight: 600;
            color: #fff;
            background: var(--primary-gradient);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .todo-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .todo-list::-webkit-scrollbar {
            width: 6px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 3px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease-out;
            border: 1px solid transparent;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border);
            transform: translateX(5px);
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.5);
        }

        .custom-checkbox {
            position: relative;
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 1;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .custom-checkbox input:checked ~ .checkmark {
            background: var(--success-gradient);
            border-color: transparent;
        }

        .checkmark::after {
            content: '';
            position: absolute;
            display: none;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .custom-checkbox input:checked ~ .checkmark::after {
            display: block;
            animation: checkPop 0.3s ease;
        }

        @keyframes checkPop {
            0% { transform: rotate(45deg) scale(0); }
            50% { transform: rotate(45deg) scale(1.2); }
            100% { transform: rotate(45deg) scale(1); }
        }

        .todo-text {
            flex: 1;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            word-break: break-word;
        }

        .delete-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #f5576c;
            background: rgba(245, 87, 108, 0.2);
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .clear-all-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: rgba(245, 87, 108, 0.2);
            border: 1px solid rgba(245, 87, 108, 0.3);
            border-radius: 12px;
            color: #f5576c;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .clear-all-btn:hover {
            background: rgba(245, 87, 108, 0.3);
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .app-header h1 {
                font-size: 2rem;
            }

            .todo-card {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .stats-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>✨ My Tasks</h1>
            <p>Stay organized, stay productive</p>
        </header>

        <main class="todo-card">
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="What needs to be done?"
                    maxlength="150"
                    autofocus
                >
                <button id="addBtn" class="add-btn" title="Add task">+</button>
            </div>

            <div id="statsBar" class="stats-bar hidden">
                <div class="stat">
                    <span>Total</span>
                    <span id="totalCount" class="stat-number">0</span>
                </div>
                <div class="stat">
                    <span>Completed</span>
                    <span id="completedCount" class="stat-number">0</span>
                </div>
                <div class="stat">
                    <span>Pending</span>
                    <span id="pendingCount" class="stat-number">0</span>
                </div>
            </div>

            <ul id="todoList" class="todo-list"></ul>

            <div id="emptyState" class="empty-state">
                <div class="icon">📝</div>
                <p>No tasks yet. Add one above!</p>
            </div>

            <button id="clearAllBtn" class="clear-all-btn hidden">
                🗑️ Clear All Completed
            </button>
        </main>
    </div>

    <script>
        // DOM Elements
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const emptyState = document.getElementById('emptyState');
        const statsBar = document.getElementById('statsBar');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const totalCount = document.getElementById('totalCount');
        const completedCount = document.getElementById('completedCount');
        const pendingCount = document.getElementById('pendingCount');

        // Load todos from localStorage
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Generate unique ID
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Update statistics
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;

            totalCount.textContent = total;
            completedCount.textContent = completed;
            pendingCount.textContent = pending;

            // Toggle visibility
            if (total === 0) {
                emptyState.classList.remove('hidden');
                statsBar.classList.add('hidden');
                clearAllBtn.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                statsBar.classList.remove('hidden');
                clearAllBtn.classList.toggle('hidden', completed === 0);
            }
        }

        // Create todo item element
        function createTodoElement(todo) {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            li.dataset.id = todo.id;

            li.innerHTML = `
                <label class="custom-checkbox">
                    <input type="checkbox" ${todo.completed ? 'checked' : ''}>
                    <span class="checkmark"></span>
                </label>
                <span class="todo-text">${escapeHtml(todo.text)}</span>
                <button class="delete-btn" title="Delete task">✕</button>
            `;

            // Toggle complete
            const checkbox = li.querySelector('input[type="checkbox"]');
            checkbox.addEventListener('change', () => toggleComplete(todo.id));

            // Delete todo
            const deleteBtn = li.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

            return li;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Render all todos
        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach(todo => {
                todoList.appendChild(createTodoElement(todo));
            });
            updateStats();
        }

        // Add new todo
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodo = {
                id: generateId(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            saveTodos();

            // Animate new item
            const newElement = createTodoElement(newTodo);
            todoList.insertBefore(newElement, todoList.firstChild);
            updateStats();

            todoInput.value = '';
            todoInput.focus();
        }

        // Toggle todo completion
        function toggleComplete(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();

                const li = todoList.querySelector(`[data-id="${id}"]`);
                if (li) {
                    li.classList.toggle('completed', todo.completed);
                }
                updateStats();
            }
        }

        // Delete todo
        function deleteTodo(id) {
            const li = todoList.querySelector(`[data-id="${id}"]`);
            if (li) {
                li.style.animation = 'fadeIn 0.3s ease-out reverse';
                setTimeout(() => {
                    todos = todos.filter(t => t.id !== id);
                    saveTodos();
                    li.remove();
                    updateStats();
                }, 250);
            }
        }

        // Clear all completed todos
        function clearCompleted() {
            const completedItems = todoList.querySelectorAll('.completed');
            completedItems.forEach(item => {
                item.style.animation = 'fadeIn 0.3s ease-out reverse';
            });

            setTimeout(() => {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
            }, 250);
        }

        // Event Listeners
        addBtn.addEventListener('click', addTodo);

        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        clearAllBtn.addEventListener('click', clearCompleted);

        // Initial render
        renderTodos();
    </script>
</body>
</html>
